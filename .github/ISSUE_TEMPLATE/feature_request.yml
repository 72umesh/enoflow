name: ✨ Feature Request
description: Suggest an idea or enhancement for EnoFlow
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make EnoFlow better? We would love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: I wish EnoFlow could...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or feature in detail.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative ways or workarounds you have considered?
  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Would you like to implement this feature?
      options:
        - "Yes, I would like to submit a Pull Request!"
        - "I can help with testing and feedback."
        - "No, I am just submitting the proposal."
    validations:
      required: true
